<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cyber Warfare Final MCQ Test</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;background:linear-gradient(135deg,#8B0000 0%,#DC143C 100%);min-height:100vh;padding:30px 20px}.container{max-width:1200px;margin:0 auto;background:white;border-radius:15px;box-shadow:0 10px 40px rgba(0,0,0,0.2);overflow:hidden}.header{background:linear-gradient(135deg,#8B0000 0%,#DC143C 100%);color:white;padding:30px;text-align:center}.header h1{font-size:32px;margin-bottom:10px}.header p{font-size:16px;opacity:0.9}.instructions{background:#f8f9fa;padding:20px 30px;border-bottom:3px solid #8B0000}.instructions h2{color:#8B0000;font-size:20px;margin-bottom:10px}.instructions p{color:#555;font-size:15px}.content{padding:40px}.progress-bar{background:#e9ecef;height:30px;border-radius:15px;overflow:hidden;margin-bottom:30px}.progress-fill{background:linear-gradient(90deg,#8B0000 0%,#DC143C 100%);height:100%;width:0%;transition:width 0.3s;display:flex;align-items:center;justify-content:center;color:white;font-weight:bold;font-size:14px}.question-container{background:#f8f9fa;padding:30px;border-radius:10px;margin-bottom:30px}.question-number{color:#8B0000;font-weight:bold;font-size:18px;margin-bottom:15px}.question-text{color:#333;font-size:18px;margin-bottom:25px;line-height:1.6}.options-container{display:flex;flex-direction:column;gap:15px}.option{background:white;padding:20px;border-radius:8px;border:2px solid #dee2e6;cursor:pointer;transition:all 0.3s;display:flex;align-items:flex-start}.option:hover{border-color:#8B0000;transform:translateX(5px);box-shadow:0 2px 8px rgba(139,0,0,0.2)}.option-label{font-weight:bold;color:#8B0000;margin-right:15px;min-width:30px}.option-text{color:#555;line-height:1.5}.option.selected{background:#8B0000;border-color:#8B0000}.option.selected .option-label,.option.selected .option-text{color:white}.option.correct{background:#28a745;border-color:#28a745}.option.correct .option-label,.option.correct .option-text{color:white}.option.incorrect{background:#dc3545;border-color:#dc3545}.option.incorrect .option-label,.option.incorrect .option-text{color:white}.option.disabled{cursor:not-allowed;opacity:0.7}.controls{display:flex;justify-content:space-between;gap:20px;margin-top:30px;flex-wrap:wrap}.btn{padding:14px 35px;border:none;border-radius:8px;font-size:16px;font-weight:600;cursor:pointer;transition:all 0.3s}.btn-primary{background:#8B0000;color:white}.btn-primary:hover:not(:disabled){background:#DC143C;transform:translateY(-2px);box-shadow:0 5px 15px rgba(139,0,0,0.3)}.btn-secondary{background:#6c757d;color:white}.btn-secondary:hover{background:#5a6268}.btn:disabled{opacity:0.5;cursor:not-allowed}.results{display:none;padding:40px}.results.active{display:block}.results h2{font-size:36px;color:#8B0000;margin-bottom:20px;text-align:center}.final-score{font-size:64px;font-weight:bold;color:#28a745;margin:30px 0;text-align:center}.results-details{background:#f8f9fa;padding:30px;border-radius:10px;max-width:500px;margin:30px auto}.result-row{display:flex;justify-content:space-between;padding:15px 0;border-bottom:1px solid #dee2e6;font-size:18px}.result-row:last-child{border-bottom:none}.review-section{margin-top:40px}.review-question{background:#f8f9fa;padding:25px;border-radius:10px;margin-bottom:20px}.review-question-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.review-question-number{font-weight:bold;color:#8B0000;font-size:18px}.review-status{padding:5px 15px;border-radius:5px;font-weight:bold;font-size:14px}.review-status.correct{background:#28a745;color:white}.review-status.incorrect{background:#dc3545;color:white}.review-question-text{color:#333;font-size:16px;margin-bottom:20px;line-height:1.6}.review-options{display:flex;flex-direction:column;gap:10px}.review-option{padding:15px;border-radius:5px;display:flex;align-items:flex-start}.review-option-label{font-weight:bold;margin-right:10px;min-width:25px}.review-option.user-answer{background:#ffc107;border:2px solid #ff9800}.review-option.correct-answer{background:#d4edda;border:2px solid #28a745}.review-option.user-incorrect{background:#f8d7da;border:2px solid #dc3545}@media (max-width:768px){.content{padding:20px}.question-container{padding:20px}.header h1{font-size:24px}.controls{flex-direction:column}.btn{width:100%}}</style>
</head>
<body>
<div class="container">
<div class="header">
<h1>Cyber Warfare Final MCQ Test</h1>
<p>Modern Cyber Warfare, Attacks & Defense Strategies</p>
</div>
<div class="instructions">
<h2>Instructions:</h2>
<p>Select one answer for each question. You'll see if your answer is correct immediately. Click "Next" to proceed to the next question.</p>
</div>
<div class="content">
<div class="progress-bar">
<div class="progress-fill" id="progressBar">0/26</div>
</div>
<div id="quizArea">
<div class="question-container" id="questionContainer"></div>
<div class="controls">
<button class="btn btn-secondary" onclick="previousQuestion()" id="prevBtn">Previous</button>
<button class="btn btn-primary" onclick="nextQuestion()" id="nextBtn">Next</button>
<button class="btn btn-primary" onclick="submitQuiz()" id="submitBtn" style="display:none">Submit Test</button>
</div>
</div>
<div class="results" id="results">
<h2>Test Complete!</h2>
<div class="final-score" id="finalScore"></div>
<div class="results-details">
<div class="result-row"><span>Correct Answers:</span><strong id="correctAnswers"></strong></div>
<div class="result-row"><span>Wrong Answers:</span><strong id="wrongAnswers"></strong></div>
<div class="result-row"><span>Percentage:</span><strong id="percentage"></strong></div>
</div>
<div style="text-align:center;margin:20px 0"><button class="btn btn-primary" onclick="resetQuiz()">Retake Test</button></div>
<div class="review-section" id="reviewSection"></div>
</div>
</div>
</div>
<script>const questions=[{question:"What is an Advanced Persistent Threat (APT)?",options:["A type of malware designed to encrypt and lock data for ransom.","An attack designed to give a hacker long-term access to a network to obtain sensitive data.","An attack used to cripple a nation's power grid or public health systems.","NOT ALL"],correct:1},{question:"Which is a Valid example of Misconfigured systems?",options:["An open cloud storage","Exposed APIs","Default admin accounts","ALL"],correct:3},{question:"Which is TRUE about the Theft or Destruction of Hardware from cyberwarfare context?",options:["The more 'brute-force' approach to cyber-warfare and is a popular weapon used in cyber-war cases","Used in the cases namely Stuxnet and Ukrainian Power Grid.","A ransomware attack on a single computer.","A+B"],correct:3},{question:"Which of the following is the best example of a cyber warfare attack targeting critical infrastructure?",options:["A phishing campaign against corporate employees.","A ransomware attack on a single computer.","An attack on a nation's power grid, like the one Russia launched against Ukraine's power grid.","NOT ALL"],correct:2},{question:"Which is a Valid statement about Living off the land (LotL) attacks?",options:["Attackers compromise a single SW vendor or service provider to gain access to their customers' networks by injecting malicious into a trusted application during its development or distribution","This tactic involves using legitimate tools and functions already present within a target network to execute an attack. Since the attack uses native system processes, it can be much harder to detect than traditional malware.","Offenders weaponize newly discovered SW vulnerabilities that developers are not yet aware of and have not patched.","ALL"],correct:1},{question:"Which is a Valid statement about Spear phishing?",options:["Specifically targets high-value senior executives","Targets all employees in the organization","Targets a specific individual within an organization.","NOT ALL"],correct:2},{question:"What is the primary objective of cyber warfare?",options:["To steal financial information from citizens.","To conduct espionage and sabotage on critical national infrastructure.","To improve a country's own cybersecurity defenses","ALL"],correct:1},{question:"Which is NOT a typical actors in cyber warfare?",options:["State-sponsored hackers","Intelligence agencies","Organized cybercrime groups","NOT ALL"],correct:3},{question:"The 2010 Stuxnet attack, which targeted industrial control systems in Iran, is a classic example of what type of cyber warfare?",options:["Economic warfare","Psychological warfare","Attack on physical infrastructure","NOT ALL"],correct:2},{question:"Which is a Valid statement about Web Vandalism?",options:["A cyber-warrior commits defaces webpage and modifying aspects of its poorly secured framework.","An example case study when the UK hacked an Al-Qaeda website and replaced a bomb-making recipe with HTML code for cupcake recipes","Spreading political propaganda, by web pages to advocate some sort of political message.","ALL"],correct:3},{question:"Which is a Valid example of automated Infrastructure-as-Code (IaC)?",options:["It's based on rapidly deploying and configuring complex attack infrastructure, such as proxy networks and encrypted tunnels, making attribution difficult.","Combining multiple vectors, such as social engineering for initial access, technical exploits to escalate privileges, and sabotage to achieve strategic goals.","Use advanced techniques, e.g. like Kerberos ticket theft and move laterally to high-value targets, exfiltrating data over encrypted channels designed like normal network traffic.","NOT ALL"],correct:0},{question:"Which is a Valid example of Integrated Campaigns in modern cyber warfare?",options:["It's based on rapidly deploying and configuring complex attack infrastructure, such as proxy networks and encrypted tunnels, making attribution difficult.","Combining multiple vectors, such as social engineering for initial access, technical exploits to escalate privileges, and sabotage to achieve strategic goals.","Attackers use advanced techniques like Kerberos ticket theft and move laterally to reach high-value targets, exfiltrating data over encrypted channels designed to look like normal network traffic.","NOT ALL"],correct:1},{question:"Which is a Valid example of Lateral Movement and Data Exfiltration in modern cyber warfare?",options:["It's based on rapidly deploying and configuring complex attack infrastructure, such as proxy networks and encrypted tunnels, making attribution difficult.","Combining multiple vectors, such as social engineering for initial access, technical exploits to escalate privileges, and sabotage to achieve strategic goals.","Attackers use advanced techniques like Kerberos ticket theft and move laterally to reach high-value targets, exfiltrating data over encrypted channels designed to look like normal network traffic.","NOT ALL"],correct:2},{question:"Which is a Valid statement about Supply chain attacks?",options:["Threat actors compromise a single SW vendor or service provider to gain access to their customers' networks by injecting malicious into a trusted application during its development or distribution, which then delivers the malware to the end users.","This tactic involves using legitimate tools and functions already present within a target network to execute an attack. Since the attack uses native system processes, it can be much harder to detect than traditional malware.","Offenders weaponize newly discovered SW vulnerabilities that developers are not yet aware of and have not patched. And such attacks are highly effective because no security patch or defense is available to stop them","NOT ALL"],correct:0},{question:"Which is a Valid Statement about Disruption and Sabotage by Targeting Critical Infrastructure?",options:["Disruption and sabotage represent some of the most concerning motivations in cyber warfare","The 2015 BlackEnergy malware attack on Ukraine's power grid, demonstrated the real-world impact of supply chain attacks","The 2015 BlackEnergy malware attack on Ukraine's power grid, such operations and the vulnerability of critical infrastructure to cyberattacks","A+C"],correct:3},{question:"Which is a Valid statement about Web Vandalism?",options:["A cyber-warrior commits defaces webpage and modifying aspects of its poorly secured framework.","An infamous example in the case study was when the British government hacked an Al-Qaeda website and replaced a bomb-making recipe with HTML code for cupcake recipes","Spreading political propaganda, by modifying web page contents to advocate some sort of political message. Example was where the US and British intelligence conducted a cyber-espionage activity to monitor advanced weapons systems in the Middle East, with a particular focus on Israel","ALL"],correct:1},{question:"Which is a Valid statement about Whaling as a phishing attack type?",options:["Specifically targets high-value senior executives","Targets all employees in the organization","Targets a specific individual within an organization.","NOT ALL"],correct:0},{question:"Which is considered a Critical Infrastructure Attacks from the context of cyberwarfare?",options:["Damaging of public utilities (power, water, fuel, communications, commercial or transportation systems) with a virus intended to disrupt functionality.","An understanding of complex SW and the ability to circumvent cyber-security barriers is required for attacks of this degree.","A cyber-warrior commits defaces webpage and modifying aspects of its poorly secured framework.","A+B"],correct:3},{question:"Which is a Valid statement about Sabotage of Critical Infrastructure?",options:["The covert monitoring of other nations, military organizations, or corporations to steal state secrets, intelligence, or intellectual property.","Direct attacks to at disrupt, damage, or destroy essential systems such as electrical power grids, water supplies, financial networks, and communication systems.","This often involves advanced persistent threats (APTs) and sophisticated phishing campaigns to gain long-term, undetected access to sensitive systems.","ALL"],correct:1},{question:"Which is a Valid example of recent modern cyber warfare DDOS attack?",options:["2022 Russia-Ukraine conflict","2020 SolarWinds attack","2023 Microsoft Exchange exploitation","NOT ALL"],correct:0},{question:"Which is a Valid example of recent modern cyber warfare Advanced Persistent Threat (APT) Attacks?",options:["2022 Russia-Ukraine conflict","2020 SolarWinds attack","2023 Microsoft Exchange exploitation","NOT ALL"],correct:3},{question:"Which is a Valid example of recent modern cyber warfare Supply Chain Attacks?",options:["2022 Russia-Ukraine conflict","2020 SolarWinds attack via compromising SW distribution","2023 Microsoft Exchange exploitation","NOT ALL"],correct:1},{question:"Which is a Valid example of recent modern cyber warfare Quantum-Resistant Encryption Attacks?",options:["2022 Russia-Ukraine conflict","2020 SolarWinds attack via compromising SW distribution","2024 Quantum exploitation Attempts by targeting encryption systems","ALL"],correct:2},{question:"Which is Considered as a Defensive operation in modern cyber warfare?",options:["Zero Trust Security","Supply Chain Security","AI-Powered Detection","ALL"],correct:3},{question:"Which is a Valid statement about Living off the land (LotL) attacks?",options:["Threat actors compromise a single SW vendor or service provider to gain access to their customers' networks by injecting malicious into a trusted application during its development or distribution, which then delivers the malware to the end users.","This tactic involves using legitimate tools and functions already present within a target network to execute an attack. Since the attack uses native system processes, it can be much harder to detect than traditional malware.","Offenders weaponize newly discovered SW vulnerabilities that developers are not yet aware of and have not patched. And such attacks are highly effective because no security patch or defense is available to stop them","NOT ALL"],correct:1},{question:"Which is a Valid example of automated Infrastructure-as-Code (IaC)?",options:["It's based on rapidly deploying and configuring complex attack infrastructure, such as proxy networks and encrypted tunnels, making attribution difficult.","Combining multiple vectors, such as social engineering for initial access, technical exploits to escalate privileges, and sabotage to achieve strategic goals.","Attackers use advanced techniques like Kerberos ticket theft and move laterally to reach high-value targets, exfiltrating data over encrypted channels designed to look like normal network traffic.","NOT ALL"],correct:0}];let currentQuestion=0;let userAnswers=new Array(questions.length).fill(null);let answered=false;function displayQuestion(){const question=questions[currentQuestion];const container=document.getElementById('questionContainer');let optionsHTML='';question.options.forEach((option,index)=>{const isSelected=userAnswers[currentQuestion]===index;const isCorrect=index===question.correct;const isAnswered=userAnswers[currentQuestion]!==null;let optionClass='option';if(isAnswered){optionClass+=' disabled';if(isSelected&&isCorrect){optionClass+=' correct';}else if(isSelected&&!isCorrect){optionClass+=' incorrect';}else if(isCorrect){optionClass+=' correct';}}else if(isSelected){optionClass+=' selected';}optionsHTML+=`<div class="${optionClass}" onclick="${isAnswered?'':'selectOption('+index+')'}"><div class="option-label">${String.fromCharCode(65+index)}</div><div class="option-text">${option}</div></div>`;});container.innerHTML=`<div class="question-number">Question ${currentQuestion+1} of ${questions.length}</div><div class="question-text">${question.question}</div><div class="options-container">${optionsHTML}</div>`;updateProgress();updateButtons();}function selectOption(index){if(userAnswers[currentQuestion]!==null)return;userAnswers[currentQuestion]=index;displayQuestion();}function updateProgress(){const answered=userAnswers.filter(a=>a!==null).length;const percentage=(answered/questions.length)*100;const progressBar=document.getElementById('progressBar');progressBar.style.width=percentage+'%';progressBar.textContent=`${answered}/${questions.length}`;}function updateButtons(){const prevBtn=document.getElementById('prevBtn');const nextBtn=document.getElementById('nextBtn');const submitBtn=document.getElementById('submitBtn');prevBtn.disabled=currentQuestion===0;if(currentQuestion===questions.length-1){nextBtn.style.display='none';submitBtn.style.display='block';}else{nextBtn.style.display='block';submitBtn.style.display='none';}}function previousQuestion(){if(currentQuestion>0){currentQuestion--;displayQuestion();}}function nextQuestion(){if(currentQuestion<questions.length-1){currentQuestion++;displayQuestion();}}function submitQuiz(){let correct=0;userAnswers.forEach((answer,index)=>{if(answer===questions[index].correct){correct++;}});const wrong=questions.length-correct;const percentage=((correct/questions.length)*100).toFixed(1);document.getElementById('quizArea').style.display='none';document.getElementById('results').classList.add('active');document.getElementById('finalScore').textContent=`${correct}/${questions.length}`;document.getElementById('correctAnswers').textContent=correct;document.getElementById('wrongAnswers').textContent=wrong;document.getElementById('percentage').textContent=percentage+'%';displayReview();}function displayReview(){const reviewSection=document.getElementById('reviewSection');let reviewHTML='<h2 style="color:#8B0000;margin-bottom:25px">Answer Review</h2>';questions.forEach((question,qIndex)=>{const userAnswer=userAnswers[qIndex];const correctAnswer=question.correct;const isCorrect=userAnswer===correctAnswer;reviewHTML+=`<div class="review-question"><div class="review-question-header"><div class="review-question-number">Question ${qIndex+1}</div><div class="review-status ${isCorrect?'correct':'incorrect'}">${isCorrect?'Correct':'Incorrect'}</div></div><div class="review-question-text">${question.question}</div><div class="review-options">`;question.options.forEach((option,oIndex)=>{let optionClass='review-option';if(oIndex===correctAnswer&&oIndex===userAnswer){optionClass+=' correct-answer';}else if(oIndex===userAnswer&&oIndex!==correctAnswer){optionClass+=' user-incorrect';}else if(oIndex===correctAnswer){optionClass+=' correct-answer';}reviewHTML+=`<div class="${optionClass}"><div class="review-option-label">${String.fromCharCode(65+oIndex)}</div><div>${option}${oIndex===userAnswer?' (Your Answer)':''}${oIndex===correctAnswer?' (Correct Answer)':''}</div></div>`;});reviewHTML+=`</div></div>`;});reviewSection.innerHTML=reviewHTML;}function resetQuiz(){currentQuestion=0;userAnswers=new Array(questions.length).fill(null);answered=false;document.getElementById('results').classList.remove('active');document.getElementById('quizArea').style.display='block';displayQuestion();}displayQuestion();</script>
</body>
</html>
